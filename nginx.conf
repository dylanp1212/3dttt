events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 3003;
        root /usr/share/nginx/html;

        location = /3dttt {
            return 301 /3dttt/;
        }

        location /3dttt/ {
            try_files $uri $uri/index.html $uri.html =404;
        }

        error_page 404 /3dttt/404.html;
    }
}
