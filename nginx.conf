events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 3003;
        root /usr/share/nginx/html;
        # Send relative redirects (Location: /3dttt/), otherwise nginx builds
        # http://<host>:3003/3dttt/ and the browser tries to reach port 3003 directly
        absolute_redirect off;

        location = /3dttt {
            return 301 /3dttt/;
        }

        location /3dttt/ {
            try_files $uri $uri/index.html $uri.html =404;
        }

        error_page 404 /3dttt/404.html;
    }
}
